<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | MovieHub</title><link rel="stylesheet" href="/style.css">
    <script defer src="/js/movieApi.js"></script><script defer src="/js/main.js"></script><script defer src="/js/auth.js"></script>
</head>
<body class="auth-page">
    <header class="top-navbar"><div class="top-nav-inner"><a class="logo" href="/"><span class="logo-mark">M</span>MovieHub</a><div class="nav-right"><a href="/">Home</a><a class="nav-signup" href="/signup.html">Create account</a></div></div></header>
    <main class="auth-main"><section class="auth-box">
        <div class="auth-icon" aria-hidden="true">▶</div><p class="eyebrow">WELCOME BACK</p><h1>Sign in to MovieHub</h1><p class="auth-subtitle">Pick up where your next movie night begins.</p>
        <form class="auth-form" id="loginForm">
            <div class="form-field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
            <div class="form-field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></div>
            <button class="button button-primary" type="submit">Sign in</button>
        </form>
        <p class="auth-status" id="authStatus" role="alert"></p><p class="auth-footer-text">New to MovieHub? <a href="/signup.html">Create an account</a></p>
    </section></main>
</body>
</html>
